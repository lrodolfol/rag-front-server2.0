<header>
  <mat-toolbar class="toolbar">
    <div class="container">
      <a class="brand" [routerLink]="homeLink" (click)="scrollToTop()">
        <mat-icon svgIcon="storefront" aria-hidden="true" />
        AchaLocal
      </a>
      <span class="spacer"></span>
      @for (item of navigationItems(); track item.path) {
        <a mat-button [routerLink]="toRouterLink(item.path)">
          <mat-icon [svgIcon]="item.icon" aria-hidden="true" />
          {{ item.label }}
        </a>
      }
      <ng-content />
    </div>
  </mat-toolbar>
  <mat-divider />
</header>
