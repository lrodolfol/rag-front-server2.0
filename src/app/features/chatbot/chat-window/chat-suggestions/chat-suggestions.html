<p class="label" [id]="labelId">{{ suggestionsLabel }}</p>
<ul class="suggestions" role="list" [attr.aria-labelledby]="labelId">
  @for (suggestion of suggestions; track suggestion) {
    <li role="listitem">
      <button
        mat-stroked-button
        type="button"
        class="suggestion"
        [disabled]="disabled()"
        (click)="select(suggestion)"
      >
        {{ suggestion }}
      </button>
    </li>
  }
</ul>
